<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Table</title>
    <style>
        table {
            border: 2px solid #555;
            border-collapse: separate;
            border-spacing: 8px;
            width: 320px;
            text-align: center;
        }
        td {
            border: 1px solid #888;
            padding: 12px;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td colspan="2"><b>name</b></td>
            <td rowspan="2"><b>Address</b></td>
        </tr>
        <tr>
            <td><b>First</b></td>
            <td><b>Last</b></td>
        </tr>
        <tr>
            <td colspan="3" style="background-color: green;">All the data is here</td>
        </tr>
        <tr>
            <td colspan="2" rowspan="2">Hamada</td>
            <td style="color: red;">cairo</td>
        </tr>
        <tr>
            <td>At vero eos et accusamus et iusto odio dignissimos ducimus qui blanditiis</td>
        </tr>
    </table>

</body>
</html>
